<!-- Header -->
<div class="flex z-50 justify-between items-center px-6 py-4">
  <h2 mat-dialog-title>
    {{ data.title || 'common.documentPreview' }}
  </h2>
  <button matIconButton mat-dialog-close aria-label="Close image preview">
    <mat-icon name="close" iconColor="error" />
  </button>
</div>

<!-- Main Content (Image Area) -->
<section
  class="flex overflow-hidden relative flex-1 justify-center items-center w-full min-h-105 bg-transparent cursor-move select-none p-4"
  aria-label="Image preview area"
  (wheel)="onWheel($event)"
  (mousedown)="startPanning($event)"
  (mousemove)="pan($event)"
  (mouseup)="stopPanning()"
  (mouseleave)="stopPanning()"
>
  <div
    class="will-change-transform relative flex items-center justify-center"
    [class.transition-transform]="!panning()"
    [class.duration-100]="!panning()"
    [class.ease-out]="!panning()"
    [style.transform]="transformStyle()"
  >
    <img
      [ngSrc]="data.imageSrc"
      [alt]="data.title || 'common.preview'"
      width="1920"
      height="1080"
      class="max-w-[80vw] max-h-[60vh] w-auto h-auto object-contain shadow-mat-3 rounded-corner-sm border border-outline-variant/40"
      draggable="false"
      priority
    />
  </div>
</section>

<!-- Bottom Controls -->
<div class="flex z-50 justify-center items-center py-6">
  <div
    class="flex gap-2 items-center px-4 py-2 backdrop-blur-xl bg-surface-container-lowest rounded-full mat-border-subtle shadow-mat-1"
  >
    <button matIconButton (click)="zoomOut()" [matTooltip]="'common.zoomOut'" aria-label="Zoom out">
      <mat-icon name="remove" />
    </button>

    <span class="w-12 font-body-sm font-mono text-center" aria-live="polite"> {{ scalePercentage() }}% </span>

    <button matIconButton (click)="zoomIn()" [matTooltip]="'common.zoomIn'" aria-label="Zoom in">
      <mat-icon name="add" />
    </button>

    <div class="mx-2 w-px h-6 mat-border-subtle"></div>

    <button
      matIconButton
      (click)="rotateCcw()"
      [matTooltip]="'Rotate 90° CCW'"
      aria-label="Rotate image 90 degrees counter-clockwise"
    >
      <mat-icon name="rotate_90_degrees_ccw" />
    </button>

    <button
      matIconButton
      (click)="rotateCw()"
      [matTooltip]="'Rotate 90° CW'"
      aria-label="Rotate image 90 degrees clockwise"
    >
      <mat-icon name="rotate_90_degrees_cw" />
    </button>

    <button
      matIconButton
      (click)="reset()"
      [matTooltip]="'common.resetView'"
      aria-label="Reset view"
    >
      <mat-icon name="reset_exposure" />
    </button>
  </div>
</div>
