<!-- Header -->
<div class="flex z-50 justify-between items-center px-6 py-4">
  <h2 mat-dialog-title>
    {{ data.title || 'common.documentPreview' }}
  </h2>
  <button mat-icon-button mat-dialog-close aria-label="Close image preview">
    <mat-icon name="close" />
  </button>
</div>

<!-- Main Content (Image Area) -->
<div
  class="flex overflow-hidden relative flex-1 justify-center items-center w-full bg-transparent cursor-move select-none"
  (wheel)="onWheel($event)"
  (mousedown)="startPanning($event)"
  (mousemove)="pan($event)"
  (mouseup)="stopPanning()"
  (mouseleave)="stopPanning()"
>
  <div
    class="will-change-transform relative"
    [class.transition-transform]="!panning()"
    [class.duration-100]="!panning()"
    [class.ease-out]="!panning()"
    [style.transform]="transformStyle()"
  >
    <img
      [ngSrc]="data.imageSrc"
      [alt]="data.title || 'common.preview'"
      class="max-w-[85vw] max-h-[75vh] object-contain shadow-mat-3 rounded-sm"
      draggable="false"
      priority
      fill
    />
  </div>
</div>

<!-- Bottom Controls -->
<div class="flex z-50 justify-center items-center py-6">
  <div class="flex gap-2 items-center px-4 py-2 backdrop-blur-xl rounded-full mat-border-subtle shadow-mat-1">
    <button mat-icon-button (click)="zoomOut()" [matTooltip]="'common.zoomOut'" aria-label="Zoom out">
      <mat-icon name="remove" />
    </button>

    <span class="w-12 font-body-sm font-mono" aria-live="polite"> {{ scalePercentage() }}% </span>

    <button mat-icon-button (click)="zoomIn()" [matTooltip]="'common.zoomIn'" aria-label="Zoom in">
      <mat-icon name="add" />
    </button>

    <div class="mx-2 w-px h-6 mat-border-subtle"></div>

    <button mat-icon-button (click)="rotate()" [matTooltip]="'common.rotate'" aria-label="Rotate image">
      <mat-icon name="rotate_right" />
    </button>

    <button mat-icon-button (click)="reset()" [matTooltip]="'common.resetView'" aria-label="Reset view">
      <mat-icon name="restart_alt" />
    </button>
  </div>
</div>
