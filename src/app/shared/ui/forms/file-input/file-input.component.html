<div class="flex flex-col gap-1.5 w-full">
  @if (label()) {
    <label [for]="inputId" class="font-body-sm font-medium text-on-surface">
      {{ label() }}
    </label>
  }

  <input
    #fileInput
    type="file"
    [id]="inputId"
    class="hidden"
    [accept]="accept()"
    (change)="onFileChange($event)"
  />

  <button matButton="outlined" type="button" [class.border-error]="showError()" (click)="triggerUpload()">
    @if (hasFile()) {
      <!-- PREVIEW STATE -->
      @if (isImage()) {
        <img
          [ngSrc]="previewUrl() || ''"
          class="absolute inset-0 object-cover"
          [alt]="label() || 'File preview'"
          fill
        />
      } @else {
        <div class="flex flex-col items-center justify-center gap-2 p-4 text-center">
          <mat-icon name="description" size="4xl" class="text-primary" />
          <span class="font-body-sm text-on-surface truncate max-w-[90%]">
            {{ fileName() || 'File selected' }}
          </span>
        </div>
      }

      <!-- OVERLAY ACTIONS -->
      <div
        class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity elements-center gap-2"
      >
        <div class="flex flex-col items-center text-white">
          <mat-icon name="edit" size="lg" />
          <span class="font-label-sm">Change</span>
        </div>
      </div>
    } @else {
      <!-- EMPTY STATE -->
      <div class="flex flex-col items-center justify-center gap-2 text-on-surface-variant">
        <mat-icon name="upload_file" size="2xl" />
        <span class="font-body-sm">Click to upload {{ label() }}</span>
        <span class="font-label-sm text-outline">
          Max size: {{ (maxSizeBytes() / (1024 * 1024)).toFixed(0) }}MB
        </span>
      </div>
    }
  </button>

  <!-- Error Message -->
  @if (localError() || showError()) {
    <div class="flex items-center gap-1.5 px-1 animate-slide-down">
      <mat-icon name="error" size="sm" class="text-error" />
      <span class="text-error font-body-sm">
        {{ errorMessage() }}
      </span>
    </div>
  }
</div>
