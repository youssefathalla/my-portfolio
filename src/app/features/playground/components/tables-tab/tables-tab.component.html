<section id="tables" class="flex flex-col gap-6">
  <div class="flex flex-col items-start gap-3 border-b border-outline-variant pb-4 px-3">
    <mat-icon name="table_chart" size="3xl" iconColor="primary" />
    <div class="flex flex-col gap-1">
      <h2 class="font-headline-sm">Reusable Data Table</h2>
      <p class="font-body-sm text-on-surface-variant">
        Full-featured data grid with sorting, pagination, search filtering, and custom cell
        templates
      </p>
    </div>
    <span
      class="text-xs px-2.5 py-1 rounded bg-surface-container-high text-on-surface-variant font-mono"
    >
      &lt;app-reusable-table&gt;
    </span>
  </div>

  <div
    class="bg-surface-container-low p-6 rounded-corner-xs border border-outline-variant overflow-hidden"
  >
    <app-reusable-table
      [data]="tableUsers()"
      [columns]="tableColumns"
      headerTitle="User Management"
      headerIcon="people"
      subTitle="Active system users and team members"
    />
  </div>
</section>
