<main class="py-20 md:py-28">
  <div class="container mx-auto px-4 max-w-5xl space-y-16">
    <div class="text-center space-y-4">
      <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight">{{ t().hero.title }}</h1>
      <p class="text-lg text-muted-foreground max-w-2xl mx-auto">{{ t().hero.subtitle }}</p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
      @for (study of t().items; track study.slug) {
        <article class="p-8 rounded-2xl border border-border bg-card space-y-4 hover:border-primary/50 transition-all flex flex-col justify-between">
          <div class="space-y-3">
            <span class="text-xs font-mono font-semibold text-primary uppercase tracking-wider">
              {{ study.category }}
            </span>
            <h2 class="text-2xl font-bold">{{ study.title }}</h2>
            <p class="text-sm text-muted-foreground leading-relaxed">{{ study.summary }}</p>
          </div>

          <div class="flex flex-wrap gap-2 pt-4 border-t border-border/50">
            @for (tag of study.tags; track tag) {
              <span class="px-2.5 py-1 rounded-md text-xs font-mono bg-secondary text-secondary-foreground">
                {{ tag }}
              </span>
            }
          </div>
        </article>
      }
    </div>
  </div>
</main>
