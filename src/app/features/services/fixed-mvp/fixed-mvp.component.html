<main class="py-20 md:py-28">
  <div class="container mx-auto px-4 max-w-4xl space-y-12">
    <div class="space-y-4">
      <span class="inline-block px-3 py-1 rounded-full text-xs font-semibold bg-primary/10 text-primary">
        {{ t().hero.badge }}
      </span>
      <h1 class="text-3xl md:text-5xl font-extrabold tracking-tight">{{ t().hero.title }}</h1>
      <p class="text-lg text-muted-foreground leading-relaxed">{{ t().hero.subtitle }}</p>
    </div>

    <div class="p-8 rounded-2xl border border-border bg-card space-y-6">
      <h2 class="text-2xl font-bold">{{ t().deliverablesTitle }}</h2>
      <ul class="space-y-3">
        @for (item of t().deliverables; track item) {
          <li class="flex items-start gap-3 text-sm text-muted-foreground">
            <span class="text-primary font-bold">✓</span>
            <span>{{ item }}</span>
          </li>
        }
      </ul>
    </div>

    <div class="pt-4">
      <a routerLink="/contact" mat-flat-button class="h-12 px-8">
        {{ t().hero.cta }}
      </a>
    </div>
  </div>
</main>
