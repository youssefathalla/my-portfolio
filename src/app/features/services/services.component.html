<main class="py-20 md:py-28">
  <div class="container mx-auto px-4 max-w-5xl">
    <div class="text-center space-y-4 mb-16">
      <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight">
        {{ t().hero.title }}
      </h1>
      <p class="text-lg text-muted-foreground max-w-2xl mx-auto">
        {{ t().hero.subtitle }}
      </p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
      @for (card of t().cards; track card.key) {
        <div class="p-8 rounded-2xl border border-border bg-card hover:border-primary/50 transition-all flex flex-col justify-between space-y-6">
          <div class="space-y-3">
            <span class="inline-block px-3 py-1 rounded-full text-xs font-semibold bg-primary/10 text-primary">
              {{ card.badge }}
            </span>
            <h2 class="text-2xl font-bold">{{ card.title }}</h2>
            <div class="text-sm font-medium text-primary">{{ card.subtitle }}</div>
            <p class="text-sm text-muted-foreground leading-relaxed">{{ card.description }}</p>
          </div>

          <div>
            <a [routerLink]="card.link" class="inline-flex items-center text-sm font-semibold text-primary hover:underline">
              View Model Details &rarr;
            </a>
          </div>
        </div>
      }
    </div>
  </div>
</main>
