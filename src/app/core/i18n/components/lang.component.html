<button matButton [matMenuTriggerFor]="menu">
  <mat-icon name="language" />
  <span class="ml-2">{{ content().language }}</span>
</button>
<mat-menu #menu="matMenu">
  @for (target of targets(); track target.locale) {
    <a mat-menu-item [routerLink]="['/' + target.path]">
      <span>{{ content().locales[target.locale] }}</span>
    </a>
  }
</mat-menu>
