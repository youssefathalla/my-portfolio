<header class="relative w-full h-full pointer-events-none">
  <!-- Backdrop dimmer when mobile menu is open (tap outside to close) -->
  @if (isMobileMenuOpen()) {
    <div
      class="fixed inset-0 z-[-1] bg-black/50 backdrop-blur-xs lg:hidden pointer-events-auto transition-opacity"
      (click)="closeMobileMenu()"
      (keydown.escape)="closeMobileMenu()"
      tabindex="-1"
      aria-hidden="true"
    ></div>
  }

  <div
    class="relative flex flex-col mx-auto border border-solid pointer-events-auto backdrop-blur-md transition-[background-color,border-color,box-shadow,border-radius] duration-200"
    [class]="
      isMobileMenuOpen()
        ? 'w-full px-4 sm:px-6 py-1 rounded-t-none rounded-b-3xl border-x-0 border-t-0 border-b border-outline-variant/40 shadow-mat-4 bg-surface-container-high h-auto overflow-hidden'
        : isScrolled()
          ? 'lg:max-w-5xl px-4 sm:px-6 lg:rounded-full border-outline-variant/30 bg-surface-container-high/90 shadow-md lg:translate-y-2 py-1 h-full'
          : 'lg:container px-4 sm:px-6 md:px-6 py-1 rounded-none border-transparent bg-transparent shadow-none translate-y-0 h-full'
    "
  >
    <!-- Top Bar Row -->
    <div class="flex items-center justify-between w-full h-16 shrink-0">
      <!-- Brand: Youssef <Logo> Fathalla -->
      <a
        routerLink="/"
        (click)="closeMobileMenu()"
        class="flex items-center font-bold tracking-tight"
        aria-label="Youssef Fathalla Homepage"
      >
        <!-- First Name: Youssef -->
        <span
          class="hidden min-w-0 overflow-hidden font-bold transition-all select-none 2xl:inline-block lg:hidden sm:inline-block whitespace-nowrap font-headline-sm"
          [class]="
            isScrolled()
              ? 'max-w-24 opacity-100 me-1 2xl:max-w-0 2xl:opacity-0 2xl:me-0'
              : 'max-w-24 opacity-100 me-1'
          "
        >
          Youssef
        </span>

        <!-- Center Circular Logo Emblem (32px on mobile/tablet, 48px on desktop) -->
        <div class="relative size-10 md:size-12">
          <img
            src="/brand/favicon.png"
            alt="Youssef Fathalla Logo"
            class="object-cover size-full"
          />
        </div>

        <!-- Last Name: Fathalla -->
        <span
          class="hidden min-w-0 overflow-hidden font-bold transition-all select-none 2xl:inline-block lg:hidden sm:inline-block whitespace-nowrap font-headline-sm"
          [class]="
            isScrolled()
              ? 'max-w-28 opacity-100 ms-1 2xl:max-w-0 2xl:opacity-0 2xl:ms-0'
              : 'max-w-28 opacity-100 ms-1'
          "
        >
          Fathalla
        </span>
      </a>

      <!-- Center Navigation Links: Desktop Only (>= md) -->
      <nav class="items-center hidden gap-2 lg:flex" aria-label="Main navigation">
        @for (link of t().links; track link.path) {
          <a
            class="nav-items"
            [routerLink]="link.path"
            routerLinkActive
            [routerLinkActiveOptions]="{ exact: link.path === '/' }"
            [matButton]="rla.isActive ? 'tonal' : 'text'"
            #rla="routerLinkActive"
            ariaCurrentWhenActive="page"
          >
            {{ link.label }}
          </a>
        }
      </nav>

      <!-- Right Side Actions -->
      <div class="flex items-center gap-1 sm:gap-2 shrink-0">
        <!-- Call Icon Button: Mobile Only (< md) - Green Phone Icon -->
        <a
          routerLink="/contact"
          (click)="closeMobileMenu()"
          matIconButton
          matTooltip="Book a call"
          matTooltipPosition="below"
          class="md:hidden!"
          [class.hidden!]="isMobileMenuOpen()"
          aria-label="Book a call"
        >
          <mat-icon name="event" iconColor="info" type="fill" />
        </a>

        <!-- Theme toggle button -->
        <button
          type="button"
          matIconButton
          (click)="toggleTheme()"
          [attr.aria-label]="isDarkMode() ? 'Switch to light mode' : 'Switch to dark mode'"
        >
          <mat-icon [name]="isDarkMode() ? 'light_mode' : 'dark_mode'" />
        </button>

        <!-- Language Switcher: Icon Button -->
        <app-lang />

        <!-- Book a Call Full Button: Desktop Only (>= md) -->
        <a
          routerLink="/contact"
          matButton="filled"
          class="hidden! md:inline-flex!"
          [class.md:hidden!]="isMobileMenuOpen()"
        >
          <span>{{ t().cta }}</span>
          <mat-icon name="arrow_forward" size="base" iconPositionEnd />
        </a>

        <!-- Mobile Menu Toggle Button: Mobile Only (< md) -->
        <button
          type="button"
          matIconButton
          class="lg:hidden! text-foreground"
          (click)="toggleMobileMenu()"
          [attr.aria-expanded]="isMobileMenuOpen()"
          [attr.aria-label]="isMobileMenuOpen() ? 'Close navigation menu' : 'Open navigation menu'"
        >
          <mat-icon [name]="isMobileMenuOpen() ? 'close' : 'menu'" />
        </button>
      </div>
    </div>

    <!-- Mobile Expanded Dropdown Section -->
    @if (isMobileMenuOpen()) {
      <div
        class="flex flex-col w-full pt-3 pb-2 duration-200 border-t lg:hidden border-outline-variant/30 animate-in fade-in slide-in-from-top-2"
      >
        <!-- Vertical Navigation Links -->
        <nav class="flex flex-col gap-1 py-1" aria-label="Mobile navigation">
          @for (link of t().links; track link.path) {
            <a
              [routerLink]="link.path"
              routerLinkActive="bg-primary/10 text-primary font-semibold"
              [routerLinkActiveOptions]="{ exact: link.path === '/' }"
              (click)="closeMobileMenu()"
              matButton
              class="flex items-center justify-start! w-full! px-4 py-2.5 rounded-xl text-base font-medium text-foreground hover:bg-surface-variant/40 transition-colors"
            >
              {{ link.label }}
            </a>
          }
        </nav>

        <!-- Mobile Expanded CTA Button -->
        <div class="px-1 pt-3 pb-1">
          <a
            routerLink="/contact"
            (click)="closeMobileMenu()"
            matButton="filled"
            class="w-full! justify-center! py-2.5!"
          >
            <span>{{ t().cta }}</span>
            <mat-icon name="arrow_forward" size="base" iconPositionEnd />
          </a>
        </div>
      </div>
    }
  </div>
</header>
