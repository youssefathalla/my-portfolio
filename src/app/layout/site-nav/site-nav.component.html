<header class="sticky top-0 z-50 w-full border-b border-border bg-background/80 backdrop-blur-md">
  <div class="container mx-auto flex h-16 items-center justify-between px-4">
    <a routerLink="/" class="flex items-center gap-2 font-bold text-lg">
      <span class="text-primary font-mono">&lt;YF /&gt;</span>
      <span>Youssef Fathalla</span>
    </a>

    <nav class="hidden md:flex items-center gap-6">
      @for (link of t().links; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="text-primary font-medium"
          [routerLinkActiveOptions]="{ exact: link.path === '/' }"
          class="text-sm text-muted-foreground hover:text-foreground transition-colors"
        >
          {{ link.label }}
        </a>
      }
    </nav>

    <div class="flex items-center gap-3">
      <app-lang />
      <a routerLink="/contact" mat-flat-button class="hidden sm:inline-flex">
        {{ t().cta }}
      </a>
    </div>
  </div>
</header>
