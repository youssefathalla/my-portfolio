<header class="w-full pointer-events-none relative h-full">
  <div
    class="relative mx-auto flex flex-col pointer-events-auto border border-solid transition-all duration-300 ease-out h-full backdrop-blur-sm"
    [class]="
      isMobileMenuOpen()
        ? 'max-w-md md:max-w-4xl lg:max-w-5xl px-4 sm:px-6 py-2 rounded-3xl border-outline-variant/40 bg-surface dark:bg-surface-container-high shadow-mat-3 translate-y-2'
        : isScrolled()
          ? 'max-w-4xl lg:max-w-5xl px-4 sm:px-6 rounded-full border-outline-variant/30 bg-surface dark:bg-surface-container-high/90 shadow-md translate-y-2 py-1'
          : 'container px-4  sm:px-6 md:px-8 py-1 rounded-none border-transparent bg-transparent shadow-none translate-y-0'
    "
  >
    <!-- Top Bar Row -->
    <div class="flex h-full items-center justify-between w-full">
      <!-- Brand: Youssef <Logo> Fathalla -->
      <a
        routerLink="/"
        (click)="closeMobileMenu()"
        class="flex items-center font-bold tracking-tight"
        aria-label="Youssef Fathalla Homepage"
      >
        <!-- First Name: Youssef -->
        <span
          class="hidden sm:inline-block whitespace-nowrap font-headline-sm font-bold min-w-0 select-none overflow-hidden"
          [class]="isScrolled() ? 'max-w-0 opacity-0 me-0' : 'max-w-24 opacity-100 me-1'"
        >
          Youssef
        </span>

        <!-- Center Circular Logo Emblem (32px on mobile/tablet, 48px on desktop) -->
        <div class="relative size-8 md:size-12">
          <img
            src="/brand/favicon.png"
            alt="Youssef Fathalla Logo"
            class="size-full object-cover"
          />
        </div>

        <!-- Last Name: Fathalla -->
        <span
          class="hidden sm:inline-block whitespace-nowrap font-headline-sm font-bold min-w-0 select-none overflow-hidden"
          [class]="isScrolled() ? 'max-w-0 opacity-0 ms-0' : 'max-w-28 opacity-100 ms-1'"
        >
          Fathalla
        </span>
      </a>

      <!-- Center Navigation Links: Desktop Only (>= md) -->
      <nav class="hidden md:flex items-center gap-2" aria-label="Main navigation">
        @for (link of t().links; track link.path) {
          <a
            class="nav-items"
            [routerLink]="link.path"
            routerLinkActive
            [routerLinkActiveOptions]="{ exact: link.path === '/' }"
            [matButton]="rla.isActive ? 'tonal' : 'text'"
            #rla="routerLinkActive"
            ariaCurrentWhenActive="page"
          >
            {{ link.label }}
          </a>
        }
      </nav>

      <!-- Right Side Actions -->
      <div class="flex items-center gap-1 sm:gap-2 shrink-0">
        <!-- Call Icon Button: Mobile Only (< md) - Green Phone Icon -->
        <a
          routerLink="/contact"
          (click)="closeMobileMenu()"
          matIconButton
          class="md:hidden!"
          aria-label="Book a call"
        >
          <mat-icon name="call" />
        </a>

        <!-- Theme toggle button -->
        <button
          type="button"
          matIconButton
          (click)="toggleTheme()"
          [attr.aria-label]="isDarkMode() ? 'Switch to light mode' : 'Switch to dark mode'"
        >
          <mat-icon [name]="isDarkMode() ? 'light_mode' : 'dark_mode'" />
        </button>

        <!-- Language Switcher: Icon Button -->
        <app-lang />

        <!-- Book a Call Full Button: Desktop Only (>= md) -->
        <a routerLink="/contact" matButton="filled" class="hidden! md:inline-flex!">
          <span>{{ t().cta }}</span>
          <mat-icon name="arrow_forward" size="base" iconPositionEnd />
        </a>

        <!-- Mobile Menu Toggle Button: Mobile Only (< md) -->
        <button
          type="button"
          matIconButton
          class="md:hidden! text-foreground"
          (click)="toggleMobileMenu()"
          [attr.aria-expanded]="isMobileMenuOpen()"
          [attr.aria-label]="isMobileMenuOpen() ? 'Close navigation menu' : 'Open navigation menu'"
        >
          <mat-icon [name]="isMobileMenuOpen() ? 'close' : 'menu'" />
        </button>
      </div>
    </div>

    <!-- Mobile Expanded Dropdown Section -->
    @if (isMobileMenuOpen()) {
      <div
        class="md:hidden flex flex-col pt-3 pb-2 border-t border-outline-variant/30 w-full animate-in fade-in slide-in-from-top-2 duration-200"
      >
        <!-- Vertical Navigation Links -->
        <nav class="flex flex-col gap-1 py-1" aria-label="Mobile navigation">
          @for (link of t().links; track link.path) {
            <a
              [routerLink]="link.path"
              (click)="closeMobileMenu()"
              routerLinkActive="bg-primary/10 text-primary font-semibold"
              [routerLinkActiveOptions]="{ exact: link.path === '/' }"
              matButton
              class="flex items-center px-4 py-2.5 rounded-xl text-base font-medium text-foreground hover:bg-surface-variant/40 transition-colors"
            >
              {{ link.label }}
            </a>
          }
        </nav>

        <!-- Mobile Expanded CTA Button -->
        <div class="pt-3 pb-1 px-1">
          <a routerLink="/contact" (click)="closeMobileMenu()" matButton="filled">
            <span>{{ t().cta }}</span>
            <mat-icon name="arrow_forward" size="base" />
          </a>
        </div>
      </div>
    }
  </div>
</header>
