name: Jules AI Code Review

on:
  push:
    branches: [main, develop]
    paths-ignore: # Add this to ignore huge non-code files
      - '**/package-lock.json'
      - '**/yarn.lock'
      - '**/node_modules/**'
      - 'dist/**'
  pull_request:
    types: [opened, synchronize, labeled]

# Permissions are critical for Jules to post comments and read your .agent folder
permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  jules-review:
    # Only run on pushes to main/develop, or if the 'jules' label is added to a PR
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'jules')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Important for Jules to see history/diffs

      - name: Run Jules Agent
        # Using the correct repo for the Google Labs Jules Action
        uses: YousseFathalla/jules-action@main
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          prompt: |
            Task: Conduct a Senior Frontend Architect review of the latest changes.

            Context:
            - This is a zoneless, signal-first Angular 22 project (Tailwind CSS v4 + Angular Material M3).
            - Read `AGENTS.md` at the repository root first — it is the master guide.
            - Follow all rules in `.agents/rules/` and the skills in `.agents/skills/`.
            - Focus on:
              1. Signal-first patterns: signal/computed/effect, input()/output(), @if/@for, @Service().
              2. Design system adherence: Material M3 token overrides (no ::ng-deep), semantic Tailwind
                 tokens (no raw colors), suffix `!`, and reuse of src/app/shared/ui components.
              3. Clean Code & DRY: Identify code repetition, complex logic, and suggest "smart" refactorings.
              4. Architectural Integrity: Ensure high-quality, maintainable, and premium code structure.
            - Do NOT flag missing Firebase or NgRx SignalStore usage: neither dependency is installed yet.

            If violations are found, provide specific code suggestions or open a 'Fix' task on the Jules dashboard.
